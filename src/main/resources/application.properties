spring.application.name=auth-module
server.port=8080

# --- Base de données (H2 en développement) ---
spring.datasource.url=jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- JWT : TOUJOURS surcharger le secret en production (variable JWT_SECRET, Base64, >= 32 octets) ---
app.jwt.secret=${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tb2ktZW4tcHJvZHVjdGlvbi0xMjM0NTY3ODkw}
app.jwt.access-token-minutes=15
app.jwt.refresh-token-days=7

# --- Anti force brute ---
app.security.max-failed-attempts=5
app.security.lock-minutes=15

# --- OAuth2 Social Login (remplir les valeurs réelles via variables d'environnement) ---
# Google : https://console.cloud.google.com/apis/credentials
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:changeme}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:changeme}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# GitHub : https://github.com/settings/developers
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:changeme}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:changeme}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

# Spotify : https://developer.spotify.com/dashboard
spring.security.oauth2.client.registration.spotify.client-id=${SPOTIFY_CLIENT_ID:changeme}
spring.security.oauth2.client.registration.spotify.client-secret=${SPOTIFY_CLIENT_SECRET:changeme}
spring.security.oauth2.client.registration.spotify.scope=user-read-email,user-read-private
spring.security.oauth2.client.registration.spotify.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.spotify.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.spotify.authorization-uri=https://accounts.spotify.com/authorize
spring.security.oauth2.client.provider.spotify.token-uri=https://accounts.spotify.com/api/token
spring.security.oauth2.client.provider.spotify.user-info-uri=https://api.spotify.com/v1/me
spring.security.oauth2.client.provider.spotify.user-name-attribute=id

# URL de redirection après login OAuth réussi (frontend)
app.oauth2.success-redirect-url=${OAUTH2_SUCCESS_REDIRECT:http://localhost:3000/oauth/callback}

server.error.include-message=never
server.error.include-stacktrace=never
